name: Publish real screenshots from public sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-public-screens.yml', '.publish/real_shots.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-lesson-screenshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          python -m pip install playwright==1.57.0 Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xterm xvfb fonts-dejavu-core
      - name: Capture public sources and test the illustrated lesson
        run: python .publish/real_shots.py
      - name: Publish checked static assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets index.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Добавить настоящие скриншоты в первый урок и архив'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-lesson-smoke
          path: /tmp/lesson-smoke/
          retention-days: 7
