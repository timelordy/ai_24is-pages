name: Publish six-lab GitVerse course
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v5-artifact.yml']
permissions:
  contents: write
concurrency:
  group: publish-v5-artifact
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source CI artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5aa4-8210-aae3-633d984983e0/raw?se=2026-09-14T12%3A40%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=ead4cfdf-fe9d-5de9-bff7-9e97f8b23bcb&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T11%3A19%3A46Z&ske=2026-09-15T11%3A19%3A46Z&sks=b&skv=2026-02-06&sig=bwO9VCxs663hHYEUT8PRq4ecpcNOp8r3tRflq/c/FVU%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/course.zip
          echo 'c356310c356d0c54cc698f897c8f57779fa2939fe7356a6c192369d7b2d917cd  /tmp/course.zip' | sha256sum -c -
          rm -rf /tmp/course-public && mkdir /tmp/course-public
          unzip -q /tmp/course.zip -d /tmp/course-public
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/course-public')
          files=[p for p in root.rglob('*') if p.is_file()]
          if len(files)!=148: raise SystemExit(f'unexpected file count: {len(files)}')
          for p in files:
              rel=p.relative_to(root)
              if '..' in rel.parts or rel.parts[0] not in {'assets','index.html'}: raise SystemExit(f'bad path: {rel}')
              if set(rel.parts)&{'teacher','hidden-tests','solutions','.git'}: raise SystemExit(f'private path: {rel}')
          course=json.loads((root/'assets/course.json').read_text(encoding='utf-8'))
          schedule=json.loads((root/'assets/schedule.json').read_text(encoding='utf-8'))
          if len(course)!=6 or any(not x.get('success') or not x.get('failure') for x in course): raise SystemExit('bad six-lab course data')
          if any(len(x.get('dates',[]))!=6 for x in schedule): raise SystemExit('bad schedule')
          required=['index.html','assets/app.js','assets/task-page.js','assets/course.json','assets/schedule.json','assets/starters/manifest.json','assets/materials/lab-01/TASK.md','assets/materials/lab-06/TASK.md']
          for name in required:
              if not (root/name).is_file(): raise SystemExit(f'missing {name}')
          print('Verified 148-file six-lab public artifact')
          PY
      - name: Replace public portal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets index.html .nojekyll
          cp -R /tmp/course-public/assets ./assets
          cp /tmp/course-public/index.html ./index.html
          : > .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets index.html .nojekyll
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish six-lab objective GitVerse course'
          git push origin HEAD:main
