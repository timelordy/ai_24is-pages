name: Publish verified beginner course
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-v3.yml']
permissions:
  contents: write
concurrency:
  group: publish-approved-course
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and install approved public export
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, shutil, stat, tempfile, urllib.request, zipfile
          # The short-lived link serves only the reviewed public export and synthetic
          # browser-test screenshots. It grants no repository or account access.
          source = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9488-81f4-8d2d-c28387e5eaf8/raw?se=2026-09-13T20%3A17%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=b34cb062-c5e8-50db-a2b3-98e5366359dc&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T09%3A56%3A40Z&ske=2026-09-14T09%3A56%3A40Z&sks=b&skv=2026-02-06&sig=d4/whIshMtELJsG0uUsujqbfM94pArkm0vfI%2Bb4%2BDzM%3D'
          print('::add-mask::' + source)
          with urllib.request.urlopen(source, timeout=45) as response:
              payload = response.read(20_000_001)
          if len(payload) > 20_000_000:
              raise RuntimeError('Unexpected archive size')
          expected = '3e7111524cffbbf4ff76b0ef57d99d1155971fd379f272bc2454d760b7073c2e'
          if hashlib.sha256(payload).hexdigest() != expected:
              raise RuntimeError('The artifact does not match the verified CI archive')
          root = pathlib.Path.cwd().resolve()
          if {p.name for p in root.iterdir()} - {'.git', '.github', '.nojekyll', 'assets', 'index.html'}:
              raise RuntimeError('Unexpected public repository files; refusing to replace them')
          with tempfile.TemporaryDirectory() as tmp:
              staging = pathlib.Path(tmp)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  if archive.testzip() is not None:
                      raise RuntimeError('Corrupt archive')
                  for item in archive.infolist():
                      name = pathlib.PurePosixPath(item.filename)
                      if name.is_absolute() or '..' in name.parts or '\\' in item.filename:
                          raise RuntimeError('Unsafe archive path')
                      if not name.parts or name.parts[0] not in {'public', 'qa-output'}:
                          raise RuntimeError('Unexpected artifact root')
                      if set(name.parts) & {'.git', 'advanced', 'solutions', '__pycache__'}:
                          raise RuntimeError('Private or unexpected content in artifact')
                      if stat.S_ISLNK(item.external_attr >> 16):
                          raise RuntimeError('Symlinks are forbidden')
                      if item.is_dir() or name.parts[0] != 'public':
                          continue
                      rel = pathlib.Path(*name.parts[1:])
                      if rel.parts[0] not in {'assets', 'index.html', '.nojekyll'}:
                          raise RuntimeError('File outside the public allowlist')
                      destination = staging / rel
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.read(item))
              courses = json.loads((staging/'assets/course.json').read_text(encoding='utf-8'))
              if len(courses) != 7 or courses[0]['title'] != 'Правило или ИИ?':
                  raise RuntimeError('Wrong course edition')
              downloads = list((staging/'assets/downloads').glob('*.zip'))
              if len(downloads) != 8:
                  raise RuntimeError('Incomplete student downloads')
              for path in downloads:
                  with zipfile.ZipFile(path) as package:
                      if package.testzip() is not None:
                          raise RuntimeError('Broken student package')
                      for name in package.namelist():
                          parts = pathlib.PurePosixPath(name).parts
                          if set(parts) & {'solutions', 'advanced', '.git'} or 'defense-cards' in name:
                              raise RuntimeError('Private material in a student package')
              for name in ('assets', 'index.html', '.nojekyll'):
                  target = root/name
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
                  source_path = staging/name
                  if source_path.is_dir():
                      shutil.copytree(source_path, target)
                  else:
                      shutil.copyfile(source_path, target)
          # Remove this one-time bootstrap; ordinary future publishing is unchanged.
          (root/'.github/workflows/publish-approved-v3.yml').unlink()
          print('Verified public export installed: seven lessons and eight ZIP files.')
          PY
      - name: Commit public export without rewriting history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets .nojekyll .github/workflows/publish-approved-v3.yml
          git diff --cached --check
          git commit -m 'Publish verified beginner AI course from 78761813c125d43fc6e8233de47c419208aa794f'
          git push origin HEAD:main
