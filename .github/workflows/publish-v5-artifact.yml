name: Publish Campus ServiceDesk release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v5-artifact.yml']
permissions:
  contents: write
concurrency:
  group: publish-campus-servicedesk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source CI artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-9140-8243-8318-136c51baba27/raw?se=2026-09-14T15%3A36%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=dcc931f4-cfc8-5f9e-808a-a5b5bc5f6731&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-14T08%3A10%3A01Z&ske=2026-09-15T08%3A10%3A01Z&sks=b&skv=2026-02-06&sig=La4WOxZDiFEt4p74erjJM5iboqS3HStEYL0F6%2Bhdz7U%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" -o /tmp/course.zip
          echo '58d722c36b7680c8a8c8043ec4b804d59837ae2724333ed462793aef947dcc11  /tmp/course.zip' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, shutil
          root = Path('/tmp/course-public')
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile('/tmp/course.zip') as archive:
              for name in archive.namelist():
                  path = Path(name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] not in {'assets','index.html','.nojekyll'}:
                      raise SystemExit(f'bad path: {name}')
                  if set(path.parts) & {'teacher','hidden-tests','solutions','.git'}:
                      raise SystemExit(f'private path: {name}')
              archive.extractall(root)
          files = [p for p in root.rglob('*') if p.is_file()]
          if len(files) != 39: raise SystemExit(f'unexpected file count: {len(files)}')
          course = json.loads((root/'assets/course.json').read_text(encoding='utf-8'))
          release = json.loads((root/'assets/release.json').read_text(encoding='utf-8'))
          if len(course) != 6 or release.get('releasedThrough') != 1: raise SystemExit('bad release boundary')
          if [x['number'] for x in course if not x.get('locked')] != [1]: raise SystemExit('only lesson 01 must be open')
          public_text = '\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in files if p.suffix != '.zip')
          for forbidden in ['КГАСУ','ИСиТ','24ИС02','24ИС03','kgasu-campus','kgasu-isit']:
              if forbidden in public_text: raise SystemExit(f'identity leak: {forbidden}')
          visible_files = ['index.html','assets/pages-home.js','assets/pages-course.js','assets/task-page.js','assets/lib.js']
          visible_text = '\n'.join((root/name).read_text(encoding='utf-8') for name in visible_files)
          for forbidden in ['Roadmap','LOCKED','Recovery checkpoint','Definition of Done','Milestone','Workflow']:
              if forbidden in visible_text: raise SystemExit(f'unwanted English label: {forbidden}')
          for text in ['семестровый проект','Создать аккаунт GitVerse','Установить Visual Studio Code','Установить GigaCode','Резервная копия проекта']:
              if text not in public_text: raise SystemExit(f'missing lesson text: {text}')
          manifest = json.loads((root/'assets/starters/manifest.json').read_text(encoding='utf-8'))
          for key, entries in manifest.items():
              for entry in entries:
                  path = root/entry['url']
                  if not path.is_file(): raise SystemExit(f'missing archive entry: {key}/{entry["path"]}')
                  if any(part.startswith('.') for part in Path(entry['path']).parts):
                      if entry.get('content') != path.read_text(encoding='utf-8'): raise SystemExit('dotfile content mismatch')
          for n in range(2,7):
              if (root/f'assets/materials/work-{n:02}').exists(): raise SystemExit(f'future work {n} leaked')
          if 'type="importmap"' not in (root/'index.html').read_text(encoding='utf-8'): raise SystemExit('missing shared module map')
          print('Verified: lesson 01 open, complete archive, lessons 02-06 withheld')
          PY
      - name: Replace public portal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets index.html .nojekyll
          cp -R /tmp/course-public/assets ./assets
          cp /tmp/course-public/index.html ./index.html
          : > .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets index.html .nojekyll
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Открыть первый урок: исправить загрузку страницы и архива'
          git push origin HEAD:main
