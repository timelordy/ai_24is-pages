name: Publish verified beginner course
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-v3.yml'
      - '.publish/**'
permissions:
  contents: write
concurrency:
  group: publish-approved-course
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify the public-only snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, lzma, shutil, tarfile, tempfile, zipfile
          root = Path.cwd().resolve()
          allowed = {'.git', '.github', '.publish', '.nojekyll', 'assets', 'index.html'}
          if {p.name for p in root.iterdir()} - allowed:
              raise RuntimeError('Unexpected repository files; refusing to replace them')
          parts = [root/f'.publish/v3-{n:02}.b64' for n in range(8)]
          payload = base64.b64decode(''.join(p.read_text(encoding='ascii').strip() for p in parts), validate=True)
          expected = '0e87fc10e4d470aeb411390c8c9ca3abf821922841339bf1913ace6d8dd41d16'
          if hashlib.sha256(payload).hexdigest() != expected:
              raise RuntimeError('Snapshot checksum mismatch')
          raw = lzma.decompress(payload)
          if len(raw) > 5_000_000:
              raise RuntimeError('Unexpected expanded size')
          with tempfile.TemporaryDirectory() as temporary:
              staging = Path(temporary)
              with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as tar:
                  seen = set()
                  for member in tar.getmembers():
                      rel = PurePosixPath(member.name)
                      if not member.isfile() or rel.is_absolute() or '..' in rel.parts or '\\' in member.name:
                          raise RuntimeError('Unsafe snapshot entry')
                      if rel.parts[0] not in {'assets', 'index.html', '.nojekyll'} or member.name in seen:
                          raise RuntimeError('Entry outside the public allowlist')
                      if set(rel.parts) & {'solutions', 'advanced', '.git'}:
                          raise RuntimeError('Private content is forbidden')
                      seen.add(member.name)
                      target = staging.joinpath(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(tar.extractfile(member).read())
              materials = staging/'assets/materials'
              docs = ['START_HERE.md', 'COURSE_RUNBOOK.md', 'free-stack.md', 'pilot-checklist.md',
                      'security/README.md', 'assessment/RUBRIC.md', 'assessment/DEFENSE.md',
                      'teacher/FALLBACK.md', 'teacher/QUICK_START.md']
              bundle = {name: (materials/name).read_bytes() for name in docs}
              def archive(path, files):
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(path, 'w', zipfile.ZIP_DEFLATED) as out:
                      for name, content in sorted(files.items()):
                          info = zipfile.ZipInfo(name, (2026, 9, 13, 0, 0, 0))
                          info.create_system = 3
                          info.external_attr = 0o100644 << 16
                          info.compress_type = zipfile.ZIP_DEFLATED
                          out.writestr(info, content)
              for n in range(1, 8):
                  prefix = f'lessons/{n:02}'
                  names = ['workshop.html', 'LAB.md', 'report-template.md', 'data.json', 'documents.txt']
                  if n == 1:
                      names.append('optional.py')
                  files = {name: (materials/prefix/'starter'/name).read_bytes() for name in names}
                  archive(staging/f'assets/downloads/lesson-{n:02}.zip', files)
                  bundle.update({prefix+'/starter/'+name: content for name, content in files.items()})
                  for name in ['README.md', 'report-template.md']:
                      bundle[prefix+'/'+name] = (materials/prefix/name).read_bytes()
              archive(staging/'assets/downloads/course-student.zip', bundle)
              manifest = {p.relative_to(staging).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                          for p in staging.rglob('*') if p.is_file()}
              digest = hashlib.sha256(json.dumps(manifest, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              expected_manifest = 'b991fdc88935200849f8eb61428ac3c8e00592816ea71c4c9ce64b509f685cb0'
              if len(manifest) != 110 or digest != expected_manifest:
                  raise RuntimeError('Generated files differ from the verified CI artifact')
              # Artifact storage excludes hidden files; restore the known empty Pages marker.
              (staging/'.nojekyll').write_bytes(b'')
              for name in ('assets', 'index.html', '.nojekyll'):
                  target = root/name
                  if target.is_symlink():
                      raise RuntimeError('Unexpected destination symlink')
                  if target.is_dir():
                      shutil.rmtree(target)
                  elif target.exists():
                      target.unlink()
                  source = staging/name
                  if source.is_dir():
                      shutil.copytree(source, target)
                  else:
                      shutil.copyfile(source, target)
          print('All 110 public files match the approved CI artifact byte for byte; empty Pages marker restored.')
          print('Seven independent lesson ZIPs and the complete student ZIP are present.')
          PY
      - name: Commit verified public files without rewriting history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets .nojekyll
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'The verified course is already published in the repository.'
            exit 0
          fi
          git commit -m 'Publish verified beginner AI course from 78761813c125d43fc6e8233de47c419208aa794f'
          git push origin HEAD:main
